name: Build desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the builds"
        required: false
        default: "1.0.0"
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux
            bundles: "appimage,deb"
          - os: windows-latest
            label: windows
            bundles: "nsis"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        shell: bash
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          [ -z "$V" ] && V="1.0.0"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          # GNU sed on both runners (ubuntu + windows git-bash), so one syntax works.
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$V\"/" src-tauri/tauri.conf.json
          sed -i "s/^version = \"[^\"]*\"/version = \"$V\"/" src-tauri/Cargo.toml

      - name: Linux build dependencies
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          # Tauri v2's Linux toolchain: webkit2gtk 4.1, the tray/appindicator
          # libs, rsvg for icon rendering, and patchelf for the AppImage.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libxdo-dev \
            build-essential \
            file wget

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        shell: bash
        run: |
          # The npm package ships a prebuilt binary, so no lengthy cargo-install
          # compile just to get the CLI.
          npm install -g @tauri-apps/cli@^2

      - name: Build
        shell: bash
        run: tauri build --bundles ${{ matrix.bundles }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          B=src-tauri/target/release/bundle
          if [ "${{ matrix.label }}" = "linux" ]; then
            cp "$B"/appimage/*.AppImage "out/Zekoro-${VERSION}-linux.AppImage"
            cp "$B"/deb/*.deb           "out/Zekoro-${VERSION}-linux.deb"
          else
            cp "$B"/nsis/*-setup.exe     "out/Zekoro-${VERSION}-windows-setup.exe"
            # Tauri links everything but the WebView2 runtime into the single
            # release exe, so that binary doubles as the portable build.
            cp src-tauri/target/release/zekoro.exe "out/Zekoro-${VERSION}-windows-portable.exe"
          fi
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: zekoro-${{ matrix.label }}
          path: out/*
          if-no-files-found: error
          retention-days: 90
